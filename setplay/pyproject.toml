[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "setplay"
version = "0.1.0"
description = "Crew de agentes com integração ao Docodex para consulta de documentação"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "crewai>=0.80.0",
    "crewai-tools>=0.17.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "pydantic>=2.6.0",
]

[project.scripts]
setplay = "setplay.main:run"

[tool.setuptools.packages.find]
where = ["src"]
